# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_axt
# Analysed by .github/workflows/ci.yml (sonar.yml) on every pull request and on summer; Automatic Analysis is off.
sonar.organization=paxel
sonar.projectKey=paxel_axt
sonar.projectName=axt

# The conformance suite, the example scripts, the reference relay, the repository's tools and the
# build of the documentation site.
sonar.sources=conformance,relay,tools,scripts,site/assets,.github/workflows
sonar.tests=tests,relay/test_axt_relay.py,tools/test_changelog_check.py
sonar.exclusions=relay/test_axt_relay.py,tools/test_changelog_check.py
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Coverage: python.yml keeps the Cobertura XML of each part here, ts.yml the lcov of the site
# build in scripts/ (the site tests).
sonar.python.coverage.reportPaths=coverage/python.xml
sonar.javascript.lcov.reportPaths=coverage/site.lcov
