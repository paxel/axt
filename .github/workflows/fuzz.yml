name: Fuzz

# The repository's fuzz targets, weekly and by hand, from paxel/gates.
on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: paxel/gates/.github/workflows/fuzz.yml@02a81ad45b815cbed94f9bb6841424a624e8155f # v1.2.0
    with:
      stack: python
      targets: |
        fuzz/fuzz_relay.py
        fuzz/fuzz_metadata.py
