# Checks that need no build: the changelog's current section, one short
# sentence per entry (at most 25 words, the ticket link not counted).
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog entries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Changelog check — unit tests
        working-directory: tools
        run: python3 -m unittest test_changelog_check
      - name: The changelog's current section is one short sentence per entry
        run: python3 tools/changelog_check.py CHANGELOG.md
