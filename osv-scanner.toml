# osv-scanner's exceptions, read by the OSV gate (paxel/gates vulns.yml). Each one says why
# the repository is not exposed and why no update removes it, and carries a date; when the
# date passes, the gate fails again: that is the review.
#
# An advisory:
# [[IgnoredVulns]]
# id = "RUSTSEC-2026-0000"
# ignoreUntil = 2027-05-14
# reason = "..."
#
# A licence outside the standard's allowlist (one package):
# [[PackageOverrides]]
# name = "some-crate"
# ecosystem = "crates.io"
# license.ignore = true
# effectiveUntil = 2027-05-14
# reason = "..."

[[PackageOverrides]]
name = "atheris"
ecosystem = "PyPI"
license.override = ["Apache-2.0"]
effectiveUntil = 2027-05-19
reason = """deps.dev reports no licence for atheris; its LICENSE in google/atheris is \
Apache-2.0. A development tool for the fuzz targets only."""

[[PackageOverrides]]
name = "colorama"
ecosystem = "PyPI"
license.override = ["BSD-3-Clause"]
effectiveUntil = 2027-05-19
reason = """deps.dev reports no licence for colorama; its LICENSE.txt in tartley/colorama is \
BSD-3-Clause. It comes only through pytest, a development tool, on Windows."""

[[PackageOverrides]]
name = "avro"
ecosystem = "PyPI"
license.override = ["Apache-2.0"]
effectiveUntil = 2027-05-19
reason = """deps.dev reports avro's licence as non-standard; its LICENSE.txt in apache/avro is \
Apache-2.0. The conformance scripts use it to check the specification's examples; nothing this \
repository publishes contains it."""
